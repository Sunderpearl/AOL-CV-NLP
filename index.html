<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FreshScan GPT — AI-powered fruit and vegetable freshness detection. Upload photos and get instant freshness analysis.">
  <title>FreshScan GPT — Sign In</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>
  <div class="auth-page" id="authPage">

    <!-- Floating particles background -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card" id="authCard">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="assets/logo.svg" alt="FreshScan GPT logo">
        <span class="auth-logo-text">Fresh<span>Scan</span></span>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <h1 id="authTitle">Welcome Back</h1>
        <p id="authSubtitle">Sign in to continue analyzing freshness</p>
      </div>

      <!-- Auth Form -->
      <form class="auth-form" id="authForm" novalidate>

        <!-- Name (hidden in sign-in mode) -->
        <div class="form-group" id="nameFieldGroup">
          <label for="nameInput">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="name">
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="emailInput">Email</label>
          <div class="input-wrapper">
            <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" required>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <div class="input-wrapper">
            <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="form-extras">
          <a href="#" id="forgotPasswordBtn" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-submit-btn" id="authSubmitBtn">
          Sign In
          <div class="auth-spinner" id="authSpinner">
            <div class="spinner"></div>
          </div>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or</span>
      </div>

      <!-- Google Sign In -->
      <button type="button" class="google-btn" id="googleSignInBtn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <!-- Toggle Sign In / Sign Up -->
      <div class="auth-toggle">
        <span id="authToggleText">Don't have an account? </span>
        <a href="#" id="authToggle">Sign Up</a>
      </div>

    </div>
  </div>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
