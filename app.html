<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FreshScan GPT — Analyze fruit and vegetable freshness with AI. Upload photos for instant freshness reports.">
  <title>FreshScan GPT</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>
  <div class="app-layout" id="appLayout">

    <!-- ═══════ SIDEBAR ═══════ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="assets/logo.svg" alt="FreshScan" width="28" height="28">
          <span>Fresh<strong>Scan</strong></span>
        </div>
      </div>

      <!-- New Chat -->
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Chat
      </button>

      <!-- Chat History -->
      <div class="sidebar-section-label">Recent Chats</div>
      <div class="chat-list" id="chatList">
        <!-- Populated by app.js -->
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">
            <span>U</span>
          </div>
          <span class="user-name" id="userName">User</span>
        </div>
        <button class="sign-out-btn" id="signOutBtn" title="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ═══════ MAIN CONTENT ═══════ -->
    <main class="main-content" id="mainContent">

      <!-- Header -->
      <header class="app-header">
        <button class="menu-toggle" id="menuToggleBtn" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-title">
          <span class="header-model">FreshScan GPT</span>
          <span class="header-badge">AI Beta</span>
        </div>
        <div class="header-avatar" id="headerAvatar">
          <div class="user-avatar small" onclick="toggleSidebar()">
            <span>U</span>
          </div>
        </div>
      </header>

      <!-- Chat Area -->
      <div class="chat-container">
        
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">
            <img src="assets/logo.svg" alt="" width="48" height="48">
          </div>
          <h2>Welcome back, <span id="welcomeUserName">User</span>! 👋</h2>
          <p class="welcome-subtitle">Upload a photo or ask about fruit & vegetable freshness</p>
          
          <div class="welcome-suggestions">
            <button class="suggestion-chip" onclick="quickSend('How should I store my vegetables?')">
              <span class="chip-icon">🧊</span>
              <span>Storage tips</span>
            </button>
            <button class="suggestion-chip" onclick="quickSend('What is the shelf life of common fruits?')">
              <span class="chip-icon">⏰</span>
              <span>Shelf life guide</span>
            </button>
            <button class="suggestion-chip" onclick="quickSend('How do I check if my produce is fresh?')">
              <span class="chip-icon">🔍</span>
              <span>Freshness check</span>
            </button>
            <button class="suggestion-chip" onclick="document.getElementById('fileInput').click()">
              <span class="chip-icon">📸</span>
              <span>Upload a photo</span>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
          <!-- Messages rendered by chat.js -->
        </div>
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <div class="input-bar-inner">
          <button class="attach-btn" id="attachBtn" title="Attach image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <textarea id="messageInput" placeholder="Type a message or drop an image..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="input-disclaimer">FreshScan GPT uses AI for analysis. Results are estimates — always verify manually.</div>
      </div>

      <!-- Hidden file input -->
      <input type="file" id="fileInput" accept="image/*" class="visually-hidden">

    </main>
  </div>

  <!-- ═══════ IMAGE PREVIEW OVERLAY ═══════ -->
  <div class="image-preview-overlay" id="imagePreviewOverlay">
    <div class="image-preview-card">
      <div class="preview-header">
        <h3>Send Image</h3>
        <button class="preview-close" onclick="closeImagePreview()">&times;</button>
      </div>
      <div class="preview-image-container">
        <img id="previewImage" src="" alt="Preview">
      </div>
      <div class="preview-file-name" id="previewFileName"></div>
      <input type="text" id="previewCaption" class="preview-caption-input" placeholder="Add a caption (optional)...">
      <div class="preview-actions">
        <button class="preview-cancel-btn" onclick="closeImagePreview()">Cancel</button>
        <button class="preview-send-btn" onclick="sendPreviewImage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Analyze
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>

  <script>
    function quickSend(text) {
      chatEngine.sendText(text);
    }
  </script>
</body>
</html>
